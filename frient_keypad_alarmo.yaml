blueprint:
  name: "Frient Zigbee Keypad with Alarmo (PINs managed in Alarmo) - Fixed"
  description: >
    This blueprint integrates the Frient Zigbee keypad with the Alarmo alarm control panel
    via Zigbee2MQTT. PINs and RFID tags are fully managed inside Alarmo — 
    the keypad simply passes user actions (arm/disarm/emergency) to Alarmo.
  domain: automation
  author: Based on nelis and AndrejDelany blueprint. Modified by DopeHead200 & Gemini
  homeassistant:
    min_version: 2024.6.0
  source_url: "https://github.com/jan-grus/alarmo-keypad-blueprint"

  input:
    z2m_keypad_path:
      name: "MQTT State Topic of your Zigbee2MQTT Keypad"
      description: "Example: zigbee2mqtt/Keypad"
    z2m_keypad_path_set:
      name: "MQTT Set Topic of your Zigbee2MQTT Keypad"
      description: "Example: zigbee2mqtt/Keypad/set"
    control_panel:
      name: "Alarmo Control Panel"
      description: "Select your Alarmo control panel entity (alarm_control_panel)"
      selector:
        entity:
          domain: alarm_control_panel

    # Optional actions for state changes
    action_arming:
      name: "Action - Arming"
      default: []
      selector:
        action: {}
    action_armed_home:
      name: "Action - Armed Home"
      default: []
      selector:
        action: {}
    action_armed_night:
      name: "Action - Armed Night"
      default: []
      selector:
        action: {}
    action_armed_away:
      name: "Action - Armed Away"
      default: []
      selector:
        action: {}
    action_disarmed:
      name: "Action - Disarmed"
      default: []
      selector:
        action: {}
    action_pending:
      name: "Action - Pending"
      default: []
      selector:
        action: {}
    action_alarm:
      name: "Action - Alarm Triggered"
      default: []
      selector:
        action: {}
    action_panic:
      name: "Action - Panic"
      default: []
      selector:
        action: {}

triggers:
  - trigger: state
    entity_id: !input control_panel
    to: arming
    id: panel_arming
  - trigger: state
    entity_id: !input control_panel
    to: armed_home
    id: panel_armed_home
  - trigger: state
    entity_id: !input control_panel
    to: armed_night
    id: panel_armed_night
  - trigger: state
    entity_id: !input control_panel
    to: disarmed
    id: panel_disarmed
  - trigger: state
    entity_id: !input control_panel
    to: armed_away
    id: panel_armed_away
  - trigger: state
    entity_id: !input control_panel
    to: pending
    id: panel_pending
  - trigger: state
    entity_id: !input control_panel
    to: triggered
    id: panel_triggered
  - trigger: mqtt
    topic: !input z2m_keypad_path
    id: keypad_mqtt

condition: []

actions:
  - choose:
      # --- Alarmo → Keypad sync ---
      - conditions:
          - condition: trigger
            id: panel_arming
        sequence:
          - action: mqtt.publish
            data:
              topic: !input z2m_keypad_path_set
              payload: '{ "arm_mode": { "mode": "exit_delay" } }'
          - choose:
              default: !input action_arming

      - conditions:
          - condition: trigger
            id: panel_armed_away
        sequence:
          - action: mqtt.publish
            data:
              topic: !input z2m_keypad_path_set
              payload: '{ "arm_mode": { "mode": "arm_all_zones" } }'
          - choose:
              default: !input action_armed_away

      - conditions:
          - condition: trigger
            id: panel_disarmed
        sequence:
          - action: mqtt.publish
            data:
              topic: !input z2m_keypad_path_set
              payload: '{ "arm_mode": { "mode": "disarm" } }'
          - choose:
              default: !input action_disarmed

      - conditions:
          - condition: trigger
            id: panel_armed_home
        sequence:
          - action: mqtt.publish
            data:
              topic: !input z2m_keypad_path_set
              payload: '{ "arm_mode": { "mode": "arm_day_zones" } }'
          - choose:
              default: !input action_armed_home

      - conditions:
          - condition: trigger
            id: panel_armed_night
        sequence:
          - action: mqtt.publish
            data:
              topic: !input z2m_keypad_path_set
              payload: '{ "arm_mode": { "mode": "arm_night_zones" } }'
          - choose:
              default: !input action_armed_night

      - conditions:
          - condition: trigger
            id: panel_pending
        sequence:
          - action: mqtt.publish
            data:
              topic: !input z2m_keypad_path_set
              payload: '{ "arm_mode": { "mode": "entry_delay" } }'
          - choose:
              default: !input action_pending

      - conditions:
          - condition: trigger
            id: panel_triggered
        sequence:
          - action: mqtt.publish
            data:
              topic: !input z2m_keypad_path_set
              payload: '{ "arm_mode": { "mode": "in_alarm" } }'
          - choose:
              default: !input action_alarm

      # --- Keypad → Alarmo ---
      - conditions:
          - condition: trigger
            id: keypad_mqtt
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: '{{ trigger.payload_json.action == "arm_all_zones" }}'
                sequence:
                  - action: alarm_control_panel.alarm_arm_away
                    target:
                      entity_id: !input control_panel
                    data:
                      code: '{{ trigger.payload_json.action_code }}'

              - conditions:
                  - condition: template
                    value_template: '{{ trigger.payload_json.action == "arm_day_zones" }}'
                sequence:
                  - action: alarm_control_panel.alarm_arm_home
                    target:
                      entity_id: !input control_panel
                    data:
                      code: '{{ trigger.payload_json.action_code }}'

              - conditions:
                  - condition: template
                    value_template: '{{ trigger.payload_json.action == "arm_night_zones" }}'
                sequence:
                  - action: alarm_control_panel.alarm_arm_night
                    target:
                      entity_id: !input control_panel
                    data:
                      code: '{{ trigger.payload_json.action_code }}'

              - conditions:
                  - condition: template
                    value_template: '{{ trigger.payload_json.action == "disarm" }}'
                sequence:
                  - action: alarm_control_panel.alarm_disarm
                    target:
                      entity_id: !input control_panel
                    data:
                      code: '{{ trigger.payload_json.action_code }}'

              - conditions:
                  - condition: template
                    value_template: '{{ trigger.payload_json.action == "emergency" }}'
                sequence:
                  - choose:
                      default: !input action_panic
    default: []

mode: parallel
max: 10
